# 检索质量评估集（20 题）
#
# 用途：给「召回 / 重排」实验提供一把尺子。
# 与 eval/questions.yaml 的区别：那份测**端到端回答质量**，这份只测**检索环节**。
#
# 标注方式（pool 法，业界标准做法）：
#   每题先取向量 top-20 作为「标注池」→ 用 LLM 判断池内每块是否真的能回答该问题
#   → 人工抽查 20% 修正 → 得到该题的相关块集合。
#   指标：recall@5 / precision@5 / MRR / 命中率，**分母都用标注池内的相关块数**。
#
# ⚠️ pool 法的已知局限：只能发现池内出现的相关块，池外的相关块统计不到。
#    写报告时必须说明这一点。

